    <style>

      .mobile-menu-panel {
        display: none !important;

      body {

      #hero > div {
        margin-top: 0 !important;
        transform: translateY(-30px) !important;
      }

      @media (max-width: 768px) {
        body > nav,
        #root nav {
          display: none !important;
        }

        .desktop-nav-links {
          display: none !important;
        }

        .mobile-menu-button {
          display: inline-flex !important;
          position: fixed;
          top: 30px;
          right: 22px;
          z-index: 10000;

          border: 1px solid rgba(255, 255, 255, 0.24);
          background: rgba(24, 12, 4, 0.62);
          color: #fff;
          font-size: 28px;
          line-height: 1;
          cursor: pointer;
          backdrop-filter: blur(14px);

        .mobile-menu-open .mobile-menu-panel {
          display: flex !important;

          padding: 24px;
          background: rgba(24, 12, 4, 0.84);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          border: 1px solid rgba(255,255,255,0.18);

        .mobile-menu-panel a {

        .tier-text-content {
          width: calc(100vw - 48px) !important;

        #tiers,
        #tiers * {
          max-width: 100%;

        #anatomy [class*="hidden"][class*="md:flex"] {
          display: none !important;
        }

        #anatomy [class*="md:w-1/2"] {
          width: 100% !important;
          max-width: 100% !important;
        }

        #anatomy [class*="md:w-1/2"] > div {
          width: calc(100vw - 48px) !important;
          max-width: 680px !important;

          transform: none !important;
        }

        #anatomy [class*="md:w-1/2"] h3,
        #anatomy [class*="md:w-1/2"] p {
          width: 100% !important;

        #tiers .tier-text-content {

</head>
  <body>
  <img src="https://hasse.foundation/images/seal.png" alt="" class="foundation-seal-mark" aria-hidden="true" />
  <div id="root"></div>

  <script>
    const siteLinks = [
      ["About", "./about.html"],
      ["Johann Christian Hasse", "./hasse.html"],
      ["Governance", "./governance.html"],
      ["Donate", "./donate.html"],
      ["Doctrine", "./doctrine.html"],
      ["Fellowship", "./fellowship.html"],
      ["Living Labs", "./amazon-lab.html"]
    ];

    const routeMap = {
      "HASSE FOUNDATION": "./",
      "HOME": "./",
      "MANDATE": "./about.html",
      "ABOUT": "./about.html",
      "ARCHIVE": "./hasse.html",
      "JOHANN CHRISTIAN HASSE": "./hasse.html",
      "PROGRAMS": "./fellowship.html",
      "GOVERNANCE": "./governance.html",
      "DOCTRINE": "./doctrine.html",
      "FELLOWSHIP": "./fellowship.html",
      "AMAZON LAB": "./amazon-lab.html",
      "DONATE": "./donate.html",
      "SITE MAP": "./sitemap.html",
      "FOUNDATION MANDATE": "./about.html",
      "FOUNDATIONAL LINE": "./hasse.html",
      "SITE MAP": "./sitemap.html",
      "C-ECO DOCTRINE": "./doctrine.html",
      "INSTITUTIONAL MEMORY": "./hasse.html",
      "LIVING LABS": "./amazon-lab.html",
      "ORG CHART": "./governance.html",
      "MEMORANDUM": "./research/memo-us.html",
      "LEGAL DOCUMENTS": "mailto:contact@c-eco.org?subject=Request for Legal Documents"
    };

    function normalizeLabel(text) {
      return text.trim().replace(/\s+/g, " ").toUpperCase();
    }

    function updateIndexLinks() {
      document.querySelectorAll("a").forEach((link) => {
        const key = normalizeLabel(link.textContent);
        if (key === "INSTITUTIONAL " + "ARCHIVE") {
          link.textContent = "Site Map";
          link.setAttribute("href", "./sitemap.html");
          return;
        }
        if (routeMap[key]) link.setAttribute("href", routeMap[key]);
      });

      const topLinks = [
        ["About", "./about.html"],
        ["Johann Christian Hasse", "./hasse.html"],
        ["Governance", "./governance.html"],
        ["Donate", "./donate.html"],
        ["Doctrine", "./doctrine.html"],
        ["Fellowship", "./fellowship.html"],
        ["Living Labs", "./amazon-lab.html"]
      ];
      const desktopNav = document.querySelector(".desktop-nav-links")
        || [...document.querySelectorAll("nav")]
          .find((nav) => !nav.classList.contains("mobile-menu-panel") && nav.querySelectorAll("a").length >= 3);
      if (desktopNav && desktopNav.dataset.hasseNavFixed !== "true") {
        const existingLinks = [...desktopNav.querySelectorAll("a")];
        const brandTemplate = existingLinks[0];
        const navTemplate = existingLinks[1] || existingLinks[0];
        if (brandTemplate && navTemplate) {
          desktopNav.innerHTML = "";
          topLinks.forEach(([label, href], index) => {
            const link = (existingLinks[index] || (index === 0 ? brandTemplate : navTemplate)).cloneNode(false);
            link.textContent = label;
            link.setAttribute("href", href);
            desktopNav.appendChild(link);
          });
          desktopNav.dataset.hasseNavFixed = "true";
        }
      }

    }

    function updateFoundationCopy() {
      const replacements = new Map([
        [
          "MANDATE",
          "FOUNDATION MANDATE"
        ],
        [
          "Preserve. Research. Activate.",
          "Preserve memory. Build doctrine. Activate governance."
        ],
        [
          "The Foundation should read as an institution of record: quiet, researched, legally literate, and built for longevity. We preserve institutional memory as a public asset, develop legal frameworks for systemic and ecological risk, and translate archival continuity into research, doctrine, and field action. The Foundation is the institutional container; its programs are the operational arms.",
          "The Johann Christian Hasse Foundation is an institution of record for legal memory, systemic-risk research, and long-term civic resilience. It preserves documentary continuity as a public asset, develops legal architecture for ecological and institutional thresholds, and translates that work into doctrine, fellowship, and field research. The Foundation remains the institutional home; its programs carry the work into law, research, and territory."
        ],
        [
          "ARCHIVE",
          "INSTITUTIONAL MEMORY"
        ],
        [
          "Built from documentary memory",
          "Documentary continuity as public infrastructure"
        ],
        [
          "2026 — Foundation year. The institutional premise begins: time is life as memory. Kiel — Juridical lineage. A legal and scholarly inheritance carried through institutions, not nostalgia. Amazon — Living systems. Field intelligence where territory, law, climate, and public duty meet.",
          "Archive here means more than storage. It is the disciplined preservation of lineage, memoranda, legal records, and research materials so institutional memory can remain usable over time. Kiel anchors the juridical lineage; the Foundation year marks the contemporary container; the Amazon gives the work its living-system test."
        ],
        [
          "PROGRAMS",
          "OPERATIONAL PROGRAMS"
        ],
        [
          "Research, doctrine, field work",
          "Doctrine, fellowship, living labs"
        ],
        [
          "c-ECO and the living labs appear as initiatives of the Foundation, while the Foundation remains the institutional container. c-ECO Doctrine offers predictive governance and legal activation for ecological thresholds. Institutional Memory provides archival structure for memoranda, lineage records, and foundation documents. Living Labs conduct applied research in territory, with special focus on Amazon governance.",
          "c-ECO Doctrine, the Fellowship Program, and the Living Labs operate as the Foundation's applied arms. c-ECO develops predictive governance and legal activation for systemic thresholds. The Fellowship trains case-based analysis and institutional translation. The Living Labs test research in territory, with the Amazon as the primary field context."
        ]
      ]);

      document.querySelectorAll("h1, h2, h3, h4, p, span, li, a").forEach((node) => {
        const text = node.textContent.trim().replace(/\s+/g, " ");
        if (replacements.has(text)) {
          node.textContent = replacements.get(text);
        }
      });
    }

    window.addEventListener("load", updateIndexLinks);
    window.addEventListener("load", updateFoundationCopy);
    setTimeout(updateIndexLinks, 150);
    setTimeout(updateIndexLinks, 800);
    setTimeout(updateFoundationCopy, 150);
    setTimeout(updateFoundationCopy, 800);

    const menuButton = document.createElement("button");
    menuButton.className = "mobile-menu-button";
    menuButton.type = "button";
    menuButton.innerHTML = "☰";
    menuButton.setAttribute("aria-label", "Open menu");
    menuButton.setAttribute("aria-expanded", "false");

    const mobilePanel = document.createElement("nav");
    mobilePanel.className = "mobile-menu-panel";
    mobilePanel.setAttribute("aria-label", "Mobile navigation");
    mobilePanel.innerHTML = siteLinks
      .map(([label, href]) => `<a href="${href}">${label}</a>`)
      .join("");

    document.body.appendChild(menuButton);
    document.body.appendChild(mobilePanel);

    menuButton.addEventListener("click", function () {
      const isOpen = document.body.classList.toggle("mobile-menu-open");
      menuButton.innerHTML = isOpen ? "×" : "☰";
      menuButton.setAttribute("aria-label", isOpen ? "Close menu" : "Open menu");
      menuButton.setAttribute("aria-expanded", String(isOpen));
    });

    document.addEventListener("click", function (event) {
      const target = event.target.closest("a, button");
      if (!target || target === menuButton) return;

      const text = normalizeLabel(target.textContent);

      if (routeMap[text]) {
        event.preventDefault();
        window.location.href = routeMap[text];
      }
    }, true);
  </script>
</body>
</html>
